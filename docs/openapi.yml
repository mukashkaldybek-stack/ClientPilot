openapi: 3.0.3
info:
  title: ClientPilot API
  description: High-productivity micro-SaaS API for freelancers. Manage clients, projects, real-time timers, and automated invoice generation.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local Development Backend Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service status and timestamp.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: ClientPilot API
                  timestamp:
                    type: string
                    format: date-time

  /api/clients:
    get:
      summary: List all clients
      description: Returns an array of all onboarded clients.
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
    post:
      summary: Create client
      description: Onboard a new client record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateInput'
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get client details
      responses:
        '200':
          description: Client record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update client details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateInput'
      responses:
        '200':
          description: Updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete client
      responses:
        '200':
          description: Client deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects:
    get:
      summary: List all projects
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid client_id or input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get project details
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete project
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/timers:
    get:
      summary: List all time entries
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeEntry'

  /api/timers/start:
    post:
      summary: Start a work timer
      description: Starts a new active timer session. Requires a valid project_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStartInput'
      responses:
        '201':
          description: Timer started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '422':
          description: Missing or invalid project_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/timers/stop:
    post:
      summary: Stop an active timer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStopInput'
      responses:
        '200':
          description: Stopped timer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '404':
          description: No active timer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/timers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete a time entry
      responses:
        '200':
          description: Time entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Timer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/invoices:
    get:
      summary: List all invoices
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'

  /api/invoices/generate:
    post:
      summary: Generate invoice from tracked time
      description: Aggregates unbilled time entries for a project and calculates totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceGenerateInput'
      responses:
        '201':
          description: Invoice successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/invoices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get invoice details
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/invoices/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Update invoice status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceStatusUpdateInput'
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Client:
      type: object
      required:
        - id
        - name
        - email
        - hourly_rate
        - currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: cli_1
        name:
          type: string
          example: Acme Global Corp
        email:
          type: string
          format: email
          example: billing@acmeglobal.com
        company:
          type: string
          example: Acme Global Inc
        hourly_rate:
          type: number
          example: 150
        currency:
          type: string
          example: USD
        address:
          type: string
          example: 100 Market St, San Francisco, CA
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientCreateInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Acme Global Corp
        email:
          type: string
          format: email
          example: billing@acmeglobal.com
        company:
          type: string
          example: Acme Global Inc
        hourly_rate:
          type: number
          default: 150
          example: 150
        currency:
          type: string
          default: USD
          example: USD
        address:
          type: string
          example: 100 Market St, San Francisco, CA

    ClientUpdateInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        hourly_rate:
          type: number
        currency:
          type: string
        address:
          type: string

    Project:
      type: object
      required:
        - id
        - client_id
        - name
        - hourly_rate
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: prj_1
        client_id:
          type: string
          example: cli_1
        client_name:
          type: string
          example: Acme Global Corp
        name:
          type: string
          example: Cloud Infrastructure Migration
        description:
          type: string
          example: Terraform IaC and Kubernetes cluster deployment.
        hourly_rate:
          type: number
          example: 150
        status:
          type: string
          enum: [active, in_review, completed]
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreateInput:
      type: object
      required:
        - client_id
        - name
      properties:
        client_id:
          type: string
          example: cli_1
        name:
          type: string
          example: Cloud Infrastructure Migration
        description:
          type: string
          example: Terraform IaC setup
        hourly_rate:
          type: number
          example: 150
        status:
          type: string
          enum: [active, in_review, completed]
          default: active

    ProjectUpdateInput:
      type: object
      properties:
        client_id:
          type: string
        name:
          type: string
        description:
          type: string
        hourly_rate:
          type: number
        status:
          type: string
          enum: [active, in_review, completed]

    TimeEntry:
      type: object
      required:
        - id
        - project_id
        - description
        - start_time
        - duration_seconds
        - is_active
        - is_billed
        - created_at
      properties:
        id:
          type: string
          example: tmr_1
        project_id:
          type: string
          example: prj_1
        project_name:
          type: string
          example: Cloud Infrastructure Migration
        description:
          type: string
          example: Setup Terraform backend
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          example: 7200
        is_active:
          type: boolean
          example: false
        is_billed:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time

    TimerStartInput:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string
          description: Project ID associated with this session. Must not be null or empty.
          example: prj_1
        description:
          type: string
          default: Focus Work Session
          example: Backend optimization

    TimerStopInput:
      type: object
      properties:
        id:
          type: string
          description: Optional specific timer ID. If omitted, stops the active timer.
          example: tmr_1

    InvoiceLineItem:
      type: object
      required:
        - id
        - description
        - hours
        - rate
        - amount
      properties:
        id:
          type: string
          example: li_1
        description:
          type: string
          example: Architecture design and review
        hours:
          type: number
          example: 4.5
        rate:
          type: number
          example: 150
        amount:
          type: number
          example: 675.0

    Invoice:
      type: object
      required:
        - id
        - invoice_number
        - project_id
        - client_id
        - client_name
        - issue_date
        - due_date
        - status
        - total_hours
        - hourly_rate
        - total_amount
        - currency
        - line_items
        - created_at
      properties:
        id:
          type: string
          example: inv_1
        invoice_number:
          type: string
          example: INV-2026-001
        project_id:
          type: string
          example: prj_1
        project_name:
          type: string
          example: Cloud Infrastructure Migration
        client_id:
          type: string
          example: cli_1
        client_name:
          type: string
          example: Acme Global Corp
        client_address:
          type: string
        client_email:
          type: string
        issue_date:
          type: string
          format: date
          example: "2026-10-20"
        due_date:
          type: string
          format: date
          example: "2026-11-03"
        status:
          type: string
          enum: [draft, sent, paid]
          example: draft
        total_hours:
          type: number
          example: 12.5
        hourly_rate:
          type: number
          example: 150
        total_amount:
          type: number
          example: 1875.0
        currency:
          type: string
          example: USD
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    InvoiceGenerateInput:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string
          example: prj_1
        notes:
          type: string
          example: Payment due in 14 days
        due_days:
          type: integer
          default: 14
          example: 14

    InvoiceStatusUpdateInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [draft, sent, paid]
          example: paid

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Validation Error
        field:
          type: string
          example: project_id
        message:
          type: string
          example: project_id is required

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Resource not found
